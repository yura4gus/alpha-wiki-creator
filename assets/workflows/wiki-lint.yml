name: wiki-lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install uv
        run: pip install uv
      - name: run lint
        run: python3 .alpha-wiki/run.py -m tools.lint --wiki-dir wiki --config .alpha-wiki/config.yaml --dry-run
      - name: check canonical document log
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            python3 .alpha-wiki/run.py -m tools.document_worker check --root . --config .alpha-wiki/config.yaml --base "$BASE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            python3 .alpha-wiki/run.py -m tools.document_worker check --root . --config .alpha-wiki/config.yaml --base HEAD^
          else
            echo "Initial repository commit: document governance starts after bootstrap."
          fi
