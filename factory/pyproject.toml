[project]
name = "agent-factory"
version = "0.1.0"
description = "Temporal-powered Alpha-Wiki Agent Factory V1 (isolated from the plugin runtime)"
requires-python = ">=3.12"
dependencies = ["temporalio>=1.9"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
addopts = "-ra -q"
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]
