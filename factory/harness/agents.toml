# Registry consumed by `temporal-agent-harness dev|serve|doctor`.
# The coordinator worker (`python -m agent_factory.harness.worker`) polls the same queue.
# Console and session manager run from the `harness` extra; the profile is generated by
# `temporal-agent-harness schema agent_factory.harness.coordinator:FactoryCoordinatorAgent`.

[[agents]]
key = "factory-coordinator"
workflow_type = "FactoryCoordinatorAgent"
task_queue = "factory-coordinator"
label = "Alpha-Wiki Factory Coordinator"
schema = "FactoryCoordinatorAgent.schema.json"
description = """
Typed, durable operator surface for Alpha-Wiki Agent Factory tasks. Submit a task spec to
start the existing TaskWorkflow (checkpointed agent steps, tests, independent review, durable
approval, PR, xPlan dry-run, receipt); poll its state and receipt; approve or reject at the
TaskWorkflow approval boundary; or cancel it. Submit a frozen batch manifest to start the
deterministic BatchWorkflow (allowlisted runner, per-unit checkpoints, optional DQ) without
coding review or a PR; poll or cancel it by job id. No model is called here: the coordinator
only starts, reads, decides and cancels factory workflows.
"""
